<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify Catalog and Merchandising Intelligence workflow</title>
  <desc id="desc">Public storefront, products feed, and collections feed pass through secure bounded collection and evidence semantics into a review queue, CRM enrichment, or scheduled monitoring.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F6F0E7"/><stop offset="1" stop-color="#E7F2EE"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#153D3A"/><stop offset="1" stop-color="#254F76"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#26453E" flood-opacity=".16"/></filter>
    <style>.s{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.ink{fill:#173A38}.muted{fill:#617772}.label{font-size:19px;font-weight:780;letter-spacing:2px}.body{font-size:22px}.small{font-size:18px}.title{font-size:28px;font-weight:790}</style>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg2)"/>
  <g class="s">
    <text x="82" y="105" class="label" fill="#23806B">HOW THE EVIDENCE PIPELINE WORKS</text>
    <text x="82" y="174" font-size="57" font-weight="830" fill="url(#ink)">From public feeds to a defensible lead decision</text>
    <text x="84" y="222" class="body muted">Bounded collection, explicit count semantics, provenance, and a human review boundary.</text>

    <g filter="url(#sh)">
      <rect x="82" y="292" width="342" height="430" rx="28" fill="#FFFFFF"/>
      <text x="118" y="342" class="label muted">01 · PUBLIC SOURCES</text>
      <g transform="translate(118 380)">
        <rect width="270" height="82" rx="18" fill="#E7F6EF"/><circle cx="34" cy="41" r="15" fill="#53C9A2"/><text x="62" y="36" class="title ink">Storefront</text><text x="62" y="61" class="small muted">Shopify signatures · currency</text>
        <rect y="101" width="270" height="82" rx="18" fill="#E9F0FA"/><circle cx="34" cy="142" r="15" fill="#72A8E8"/><text x="62" y="137" class="title ink">products.json</text><text x="62" y="162" class="small muted">products · variants · prices</text>
        <rect y="202" width="270" height="82" rx="18" fill="#FFF0D8"/><circle cx="34" cy="243" r="15" fill="#F2B55F"/><text x="62" y="238" class="title ink">collections.json</text><text x="62" y="263" class="small muted">observed collection count</text>
      </g>
      <text x="118" y="691" font-size="16" class="muted">Submitted sites · no login or Admin API</text>

      <rect x="470" y="266" width="556" height="482" rx="30" fill="#153D3A"/>
      <text x="510" y="319" class="label" fill="#A9D5C8">02 · BOUNDED PROCESSING</text>
      <g transform="translate(510 357)">
        <rect width="476" height="62" rx="16" fill="#1E504A"/><text x="24" y="39" class="body" fill="#F3FAF8">✓ HTTP(S), DNS and redirect safety checks</text>
        <rect y="78" width="476" height="62" rx="16" fill="#1E504A"/><text x="24" y="117" class="body" fill="#F3FAF8">✓ 3 pages × 250 product cap disclosed</text>
        <rect y="156" width="476" height="62" rx="16" fill="#1E504A"/><text x="24" y="195" class="body" fill="#F3FAF8">✓ exact vs lower-bound count semantics</text>
        <rect y="234" width="476" height="62" rx="16" fill="#1E504A"/><text x="24" y="273" class="body" fill="#F3FAF8">✓ stable IDs · freshness · source evidence</text>
        <rect y="312" width="476" height="76" rx="16" fill="#0D2D2A" stroke="#70DAB7"/><text x="24" y="343" class="small" fill="#A9D5C8">HONESTY BOUNDARY</text><text x="24" y="373" class="body" fill="#79F2C0">Revenue is not inferred.</text>
      </g>

      <rect x="1072" y="292" width="446" height="430" rx="28" fill="#FFFFFF"/>
      <text x="1108" y="342" class="label muted">03 · DECISION LAYER</text>
      <g transform="translate(1108 380)">
        <rect width="374" height="70" rx="18" fill="#E7F6EF"/><text x="24" y="30" class="small" fill="#3C6E62">QUALIFY</text><text x="24" y="56" class="title ink">catalog + price fit</text>
        <rect y="88" width="374" height="70" rx="18" fill="#E9F0FA"/><text x="24" y="118" class="small" fill="#506D8C">PERSONALIZE</text><text x="24" y="144" class="title ink">vendor + category facts</text>
        <rect y="176" width="374" height="70" rx="18" fill="#FFF0D8"/><text x="24" y="206" class="small" fill="#7D633D">PRIORITIZE</text><text x="24" y="232" class="title ink">merchandising recency</text>
        <rect y="264" width="374" height="72" rx="18" fill="#233E5D"/><text x="24" y="294" class="small" fill="#B6CDE4">VERIFY</text><text x="24" y="321" class="title" fill="#FFFFFF">confidence + gaps + action</text>
      </g>
    </g>

    <path d="M432 507 H456" stroke="#31A985" stroke-width="7" stroke-linecap="round"/><path d="M446 495 L462 507 L446 519" fill="none" stroke="#31A985" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1034 507 H1058" stroke="#397CB7" stroke-width="7" stroke-linecap="round"/><path d="M1048 495 L1064 507 L1048 519" fill="none" stroke="#397CB7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(82 792)"><rect width="1436" height="62" rx="20" fill="#173A38"/><text x="30" y="40" class="body" fill="#F5FAF9">Observed fact → evidence scope → confidence → explicit gap → recommended human action</text><text x="1258" y="40" class="label" fill="#79F2C0">REVIEW READY</text></g>
  </g>
</svg>
