<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shopify Catalog and Merchandising Intelligence</title>
  <desc id="desc">A list of merchant domains becomes evidence-backed catalog, price-positioning, and merchandising signals for lead review, without fabricated revenue estimates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071C1A"/><stop offset="0.56" stop-color="#102827"/><stop offset="1" stop-color="#15213A"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79F2C0"/><stop offset="1" stop-color="#7EB6FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.34"/></filter>
    <style>.s{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.w{fill:#F5FAF9}.m{fill:#A8BFBA}.label{font-size:20px;font-weight:780;letter-spacing:2px}.body{font-size:24px}.small{font-size:19px}.card{font-size:27px;font-weight:760}.metric{font-size:41px;font-weight:830}</style>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <circle cx="1450" cy="110" r="270" fill="#7EB6FF" opacity=".08"/><circle cx="80" cy="850" r="300" fill="#79F2C0" opacity=".06"/>
  <g class="s">
    <g transform="translate(82 58)"><rect width="310" height="46" rx="23" fill="#79F2C0" opacity=".13"/><circle cx="27" cy="23" r="8" fill="#79F2C0"/><text x="48" y="31" class="label" fill="#A4F7D4">SHOPIFY LEAD SIGNALS</text></g>
    <text x="82" y="175" class="w" font-size="61" font-weight="830">Know which Shopify lead</text>
    <text x="82" y="244" font-size="61" font-weight="830" fill="url(#accent)">is worth reviewing — and why</text>
    <text x="84" y="294" class="m" font-size="24">Public storefront evidence in. Catalog fit, price positioning, activity, gaps, and a next action out.</text>

    <g filter="url(#shadow)">
      <rect x="82" y="354" width="360" height="353" rx="28" fill="#102F2B" stroke="#37645C" stroke-width="2"/>
      <text x="118" y="405" class="label m">01 · YOUR LEAD LIST</text>
      <rect x="118" y="444" width="288" height="62" rx="16" fill="#0B2421"/><circle cx="146" cy="475" r="10" fill="#79F2C0"/><text x="170" y="483" class="body w">allbirds.com</text>
      <rect x="118" y="520" width="288" height="62" rx="16" fill="#0B2421"/><circle cx="146" cy="551" r="10" fill="#79F2C0"/><text x="170" y="559" class="body w">gymshark.com</text>
      <rect x="118" y="596" width="288" height="62" rx="16" fill="#0B2421"/><circle cx="146" cy="627" r="10" fill="#7EB6FF"/><text x="170" y="635" class="body w">stripe.com</text>
      <text x="118" y="690" class="small m">1–100 public HTTP(S) websites</text>

      <rect x="494" y="330" width="604" height="401" rx="30" fill="#F5F8F4"/>
      <text x="532" y="382" class="label" fill="#56706A">02 · OBSERVED STORE EVIDENCE</text>
      <text x="532" y="431" class="card" fill="#102827">Confirmed Shopify storefront</text>
      <g transform="translate(532 466)">
        <rect width="246" height="100" rx="20" fill="#E4F7ED"/><text x="23" y="43" class="metric" fill="#11795A">750+</text><text x="23" y="76" class="small" fill="#45655B">products observed</text><text x="23" y="96" font-size="15" fill="#6A827B">LOWER BOUND</text>
        <rect x="264" width="270" height="100" rx="20" fill="#E8F0FC"/><text x="287" y="43" class="metric" fill="#245F9E">USD 3–160</text><text x="287" y="76" class="small" fill="#4F657D">variant list prices</text><text x="287" y="96" font-size="15" fill="#708299">OBSERVED</text>
        <rect y="120" width="246" height="100" rx="20" fill="#FFF1D8"/><text x="23" y="162" class="card" fill="#925D0B">Recent activity</text><text x="23" y="196" class="small" fill="#735F3A">newest product age</text>
        <rect x="264" y="120" width="270" height="100" rx="20" fill="#F2E9F7"/><text x="287" y="162" class="card" fill="#69447A">Revenue: unknown</text><text x="287" y="196" class="small" fill="#765F80">not fabricated from catalog</text>
      </g>
      <text x="532" y="710" class="small" fill="#60726E">Every metric carries scope, evidence, confidence, and data gaps.</text>

      <rect x="1152" y="354" width="366" height="353" rx="28" fill="#142B43" stroke="#426785" stroke-width="2"/>
      <text x="1188" y="405" class="label m">03 · REVIEW ACTION</text>
      <rect x="1188" y="445" width="294" height="69" rx="18" fill="#1B3B54"/><text x="1216" y="474" class="small" fill="#A9C8E7">SEGMENT</text><text x="1216" y="501" class="body w">catalog-fit lead</text>
      <rect x="1188" y="531" width="294" height="69" rx="18" fill="#1B3B54"/><text x="1216" y="560" class="small" fill="#A9C8E7">PERSONALIZE</text><text x="1216" y="587" class="body w">with observed facts</text>
      <rect x="1188" y="617" width="294" height="55" rx="18" fill="#79F2C0"/><text x="1216" y="652" class="card" fill="#09231D">REVIEW FIRST</text>
      <text x="1188" y="696" class="small m">safeToAutomate = false</text>
    </g>
    <path d="M450 530 H482" stroke="#79F2C0" stroke-width="7" stroke-linecap="round"/><path d="M470 518 L486 530 L470 542" fill="none" stroke="#79F2C0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1106 530 H1140" stroke="#7EB6FF" stroke-width="7" stroke-linecap="round"/><path d="M1128 518 L1144 530 L1128 542" fill="none" stroke="#7EB6FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(82 790)"><rect width="1436" height="62" rx="20" fill="#0B2322" stroke="#31524D"/><text x="30" y="40" class="body w">No login · No Shopify API key · No sales or revenue claims · Review-ready JSON</text><text x="1254" y="40" class="label" fill="#79F2C0">EVIDENCE FIRST</text></g>
  </g>
</svg>
