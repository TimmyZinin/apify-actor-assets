<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Website Tech Stack Detector — from a submitted URL to review-ready evidence</title>
  <desc id="desc">A dark product diagram showing a website, observed technology signatures with provenance, and a structured decision row.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10233d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39d0c3"/><stop offset="1" stop-color="#65a6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02060d" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1420" cy="100" r="260" fill="#234d7b" opacity=".2"/><circle cx="180" cy="810" r="300" fill="#0aa89b" opacity=".11"/>
  <text x="92" y="92" fill="#8da7c7" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="3">WEBSITE TECH STACK DETECTOR</text>
  <text x="92" y="160" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="800">Turn a public page into</text>
  <text x="92" y="222" fill="url(#accent)" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="800">review-ready technology evidence</text>
  <text x="92" y="272" fill="#b7c7dc" font-family="Inter,Arial,sans-serif" font-size="25">Observed signatures, provenance, confidence, gaps, and a conservative next action.</text>

  <g filter="url(#shadow)">
    <rect x="92" y="342" width="390" height="388" rx="30" fill="#101f33" stroke="#29425f" stroke-width="2"/>
    <rect x="124" y="380" width="326" height="52" rx="14" fill="#07111f" stroke="#334c68"/>
    <circle cx="150" cy="406" r="7" fill="#39d0c3"/><text x="172" y="415" fill="#eaf2ff" font-family="Inter,Arial,sans-serif" font-size="20">shop.example.com</text>
    <rect x="124" y="466" width="326" height="190" rx="18" fill="#0a1728"/>
    <rect x="154" y="500" width="160" height="18" rx="9" fill="#65a6ff" opacity=".9"/>
    <rect x="154" y="534" width="252" height="12" rx="6" fill="#637894"/>
    <rect x="154" y="560" width="222" height="12" rx="6" fill="#3e536e"/>
    <rect x="154" y="600" width="95" height="34" rx="17" fill="#153e52"/><text x="177" y="623" fill="#55ded1" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">PUBLIC</text>
    <text x="124" y="700" fill="#8da7c7" font-family="Inter,Arial,sans-serif" font-size="19">Initial HTML + response headers</text>
  </g>

  <path d="M506 536H594" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/><path d="M578 522l18 14-18 14" fill="none" stroke="#65a6ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="620" y="342" width="390" height="388" rx="30" fill="#101f33" stroke="#29425f" stroke-width="2"/>
    <text x="654" y="395" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800">Observed fingerprints</text>
    <g font-family="Inter,Arial,sans-serif">
      <rect x="654" y="430" width="322" height="64" rx="14" fill="#132a3e"/><circle cx="683" cy="462" r="10" fill="#39d0c3"/><text x="706" y="457" fill="#edf6ff" font-size="20" font-weight="700">Shopify</text><text x="706" y="480" fill="#8fa7c4" font-size="15">public HTML signature</text>
      <rect x="654" y="510" width="322" height="64" rx="14" fill="#132a3e"/><circle cx="683" cy="542" r="10" fill="#65a6ff"/><text x="706" y="537" fill="#edf6ff" font-size="20" font-weight="700">Cloudflare</text><text x="706" y="560" fill="#8fa7c4" font-size="15">response header · cf-ray</text>
      <rect x="654" y="590" width="322" height="64" rx="14" fill="#132a3e"/><circle cx="683" cy="622" r="10" fill="#d393ff"/><text x="706" y="617" fill="#edf6ff" font-size="20" font-weight="700">Google Tag Manager</text><text x="706" y="640" fill="#8fa7c4" font-size="15">public HTML signature</text>
    </g>
    <text x="654" y="698" fill="#8da7c7" font-family="Inter,Arial,sans-serif" font-size="17">No raw HTML or header values emitted</text>
  </g>

  <path d="M1034 536h88" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/><path d="M1106 522l18 14-18 14" fill="none" stroke="#65a6ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="1148" y="320" width="360" height="432" rx="30" fill="#f4f8ff"/>
    <text x="1182" y="374" fill="#13243c" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800">Decision row</text>
    <text x="1182" y="416" fill="#52657d" font-family="Inter,Arial,sans-serif" font-size="17">TECHNOLOGIES</text><text x="1430" y="416" fill="#13243c" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">3</text>
    <line x1="1182" y1="438" x2="1474" y2="438" stroke="#d5dfed"/>
    <text x="1182" y="476" fill="#52657d" font-family="Inter,Arial,sans-serif" font-size="17">COVERAGE</text><text x="1430" y="476" fill="#0c857d" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">90 / 100</text>
    <text x="1182" y="524" fill="#52657d" font-family="Inter,Arial,sans-serif" font-size="17">CONFIDENCE</text><text x="1430" y="524" fill="#256bbd" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">HIGH</text>
    <rect x="1182" y="558" width="292" height="78" rx="15" fill="#e5f3ff"/><text x="1202" y="585" fill="#2e5f93" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">NEXT ACTION</text><text x="1202" y="613" fill="#13243c" font-family="Inter,Arial,sans-serif" font-size="17">Review before segmentation</text>
    <rect x="1182" y="658" width="292" height="54" rx="15" fill="#fff0eb"/><circle cx="1208" cy="685" r="8" fill="#f27152"/><text x="1228" y="692" fill="#8c3d2b" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">safeToAutomate: false</text>
  </g>

  <text x="800" y="830" text-anchor="middle" fill="#8fa7c4" font-family="Inter,Arial,sans-serif" font-size="22">Evidence for human decisions — not a claim of vendor contract, budget, intent, or complete stack.</text>
</svg>
