<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Detik Authorized Evidence Normalizer — buyer input to review-ready report</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071226"/><stop offset="1" stop-color="#101B32"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1510" cy="50" r="270" fill="#FF6B35" opacity="0.10"/>
  <circle cx="40" cy="870" r="230" fill="#23D5AB" opacity="0.08"/>
  <text x="82" y="104" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="760" fill="#FFFFFF">Detik Authorized Evidence Normalizer</text>
  <text x="84" y="190" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="500" fill="#AFC3E8">Turn licensed, buyer-supplied Detik records into one deterministic</text>
  <text x="84" y="228" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="500" fill="#AFC3E8">evidence report — without fetching a source page.</text>
  <rect x="82" y="320" width="420" height="390" rx="28" fill="#12213D" stroke="#62A4FF" stroke-width="2"/>
  <text x="114" y="375" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#62A4FF">BUYER INPUT</text>
  <circle cx="124" cy="430" r="7" fill="#62A4FF"/><text x="146" y="439" font-family="Inter,Arial,sans-serif" font-size="24" fill="#D9E7FF">1–25 authorized records</text>
  <circle cx="124" cy="505" r="7" fill="#62A4FF"/><text x="146" y="514" font-family="Inter,Arial,sans-serif" font-size="24" fill="#D9E7FF">Explicit rights basis</text>
  <circle cx="124" cy="580" r="7" fill="#62A4FF"/><text x="146" y="589" font-family="Inter,Arial,sans-serif" font-size="24" fill="#D9E7FF">Detik HTTPS source links</text>
  <path d="M520 515 H585" stroke="#55739E" stroke-width="5"/><path d="M585 515 l-18 -12 v24z" fill="#55739E"/>
  <rect x="600" y="320" width="420" height="390" rx="28" fill="#12213D" stroke="#A77BFF" stroke-width="2"/>
  <text x="632" y="375" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#A77BFF">NORMALIZATION</text>
  <circle cx="642" cy="430" r="7" fill="#A77BFF"/><text x="664" y="439" font-family="Inter,Arial,sans-serif" font-size="24" fill="#D9E7FF">Validate closed fields</text>
  <circle cx="642" cy="505" r="7" fill="#A77BFF"/><text x="664" y="514" font-family="Inter,Arial,sans-serif" font-size="24" fill="#D9E7FF">Canonicalize and dedupe</text>
  <circle cx="642" cy="580" r="7" fill="#A77BFF"/><text x="664" y="589" font-family="Inter,Arial,sans-serif" font-size="24" fill="#D9E7FF">Bind SHA-256 evidence</text>
  <path d="M1038 515 H1103" stroke="#55739E" stroke-width="5"/><path d="M1103 515 l-18 -12 v24z" fill="#55739E"/>
  <rect x="1118" y="320" width="400" height="390" rx="28" fill="#12213D" stroke="#23D5AB" stroke-width="2"/>
  <text x="1150" y="375" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#23D5AB">BUYER OUTCOME</text>
  <circle cx="1160" cy="430" r="7" fill="#23D5AB"/><text x="1182" y="439" font-family="Inter,Arial,sans-serif" font-size="24" fill="#D9E7FF">Normalized evidence report</text>
  <circle cx="1160" cy="505" r="7" fill="#23D5AB"/><text x="1182" y="514" font-family="Inter,Arial,sans-serif" font-size="24" fill="#D9E7FF">Gaps and review action</text>
  <circle cx="1160" cy="580" r="7" fill="#23D5AB"/><text x="1182" y="589" font-family="Inter,Arial,sans-serif" font-size="24" fill="#D9E7FF">Run-bound settlement receipt</text>
  <text x="84" y="790" font-family="Inter,Arial,sans-serif" font-size="25" fill="#8FA8CF">Zero network · no external verification · human review required</text>
  <text x="1510" y="855" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="20" fill="#7E93B5">ZININ DATA PRODUCTS · APIFY</text>
