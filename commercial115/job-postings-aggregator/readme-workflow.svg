<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>From company list to review-ready hiring research</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081226"/><stop offset="1" stop-color="#0E1B35"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="92" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="760" fill="#FFFFFF">From company list to review-ready hiring research</text>
  <text x="800" y="140" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" fill="#AFC3E5">A bounded, evidence-first workflow for recurring recruiting and account research</text>
  <rect x="70" y="225" width="330" height="430" rx="28" fill="#12213D" stroke="#62A4FF" stroke-width="2"/><text x="104" y="280" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#62A4FF">1 · INPUT</text>
  <text x="104" y="338" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">Known ATS tokens</text><text x="104" y="376" font-family="Inter,Arial,sans-serif" font-size="22" fill="#B8C9E4">Fastest, one public feed</text><text x="104" y="406" font-family="Inter,Arial,sans-serif" font-size="22" fill="#B8C9E4">request per company</text>
  <line x1="104" y1="448" x2="366" y2="448" stroke="#2E4366"/><text x="104" y="497" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">Company domains</text><text x="104" y="535" font-family="Inter,Arial,sans-serif" font-size="22" fill="#B8C9E4">Detect six ATS systems</text><text x="104" y="565" font-family="Inter,Arial,sans-serif" font-size="22" fill="#B8C9E4">with ownership disclosure</text>
  <path d="M420 440 H495" stroke="#526F9C" stroke-width="6"/><path d="M495 440 l-20 -14 v28z" fill="#526F9C"/>
  <rect x="515" y="225" width="570" height="430" rx="28" fill="#12213D" stroke="#A47CFF" stroke-width="2"/><text x="550" y="280" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#A47CFF">2 · EVIDENCE AND CONTROL</text>
  <rect x="550" y="320" width="240" height="105" rx="18" fill="#192B4A"/><text x="574" y="358" font-family="Inter,Arial,sans-serif" font-size="20" fill="#9DB3D7">SOURCE</text><text x="574" y="391" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Validate shape</text>
  <rect x="810" y="320" width="240" height="105" rx="18" fill="#192B4A"/><text x="834" y="358" font-family="Inter,Arial,sans-serif" font-size="20" fill="#9DB3D7">IDENTITY</text><text x="834" y="391" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Resolve owner</text>
  <rect x="550" y="450" width="240" height="105" rx="18" fill="#192B4A"/><text x="574" y="488" font-family="Inter,Arial,sans-serif" font-size="20" fill="#9DB3D7">DELIVERY</text><text x="574" y="521" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Cross-mode dedupe</text>
  <rect x="810" y="450" width="240" height="105" rx="18" fill="#192B4A"/><text x="834" y="488" font-family="Inter,Arial,sans-serif" font-size="20" fill="#9DB3D7">INTERPRETATION</text><text x="834" y="521" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">Expose limits</text>
  <text x="550" y="607" font-family="Inter,Arial,sans-serif" font-size="21" fill="#AFC3E5">Bounded reads · strict input · exact linked billing receipt</text>
  <path d="M1105 440 H1180" stroke="#526F9C" stroke-width="6"/><path d="M1180 440 l-20 -14 v28z" fill="#526F9C"/>
  <rect x="1200" y="225" width="330" height="430" rx="28" fill="#12213D" stroke="#22D3A7" stroke-width="2"/><text x="1234" y="280" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#22D3A7">3 · BUYER WORKFLOW</text>
  <circle cx="1245" cy="340" r="8" fill="#22D3A7"/><text x="1270" y="349" font-family="Inter,Arial,sans-serif" font-size="24" fill="#FFFFFF">Filter roles</text>
  <circle cx="1245" cy="405" r="8" fill="#22D3A7"/><text x="1270" y="414" font-family="Inter,Arial,sans-serif" font-size="24" fill="#FFFFFF">Open evidence</text>
  <circle cx="1245" cy="470" r="8" fill="#22D3A7"/><text x="1270" y="479" font-family="Inter,Arial,sans-serif" font-size="24" fill="#FFFFFF">Verify context</text>
  <circle cx="1245" cy="535" r="8" fill="#22D3A7"/><text x="1270" y="544" font-family="Inter,Arial,sans-serif" font-size="24" fill="#FFFFFF">Route manually</text>
  <text x="1234" y="603" font-family="Inter,Arial,sans-serif" font-size="20" fill="#9FB5D6">Dataset · API · webhook</text>
  <rect x="145" y="730" width="1310" height="82" rx="20" fill="#142946" stroke="#315478"/><text x="800" y="766" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#8FE8CE">SAFE OPERATING RULE</text><text x="800" y="797" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" fill="#DDE8FA">Verify the company, role and independent commercial context before CRM mutation or outreach.</text>
  <text x="1530" y="866" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="19" fill="#7186A8">ZININ DATA PRODUCTS · APIFY</text>
</svg>
