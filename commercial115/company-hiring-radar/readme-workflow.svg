<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Company Hiring Radar evidence workflow</title>
  <desc id="desc">Buyer-supplied ATS tokens pass through bounded public collection, role normalization, identity disclosure, and evidence semantics into a conservative human-review decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F3F0EA"/><stop offset="1" stop-color="#E6F1EF"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#172B46"/><stop offset="1" stop-color="#18564F"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#263C4E" flood-opacity=".16"/></filter>
    <style>.s{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.ink{fill:#172B46}.muted{fill:#64737B}.label{font-size:19px;font-weight:780;letter-spacing:2px}.body{font-size:22px}.small{font-size:18px}.title{font-size:27px;font-weight:790}</style>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <g class="s">
    <text x="82" y="105" class="label" fill="#2B7B6E">HOW THE EVIDENCE PIPELINE WORKS</text>
    <text x="82" y="174" font-size="57" font-weight="830" fill="url(#ink)">From ATS board token to a defensible research action</text>
    <text x="84" y="222" class="body muted">Bounded public sources, explicit identity ambiguity, timestamp coverage, and a human review boundary.</text>
    <g filter="url(#sh)">
      <rect x="82" y="292" width="342" height="430" rx="28" fill="#FFFFFF"/>
      <text x="118" y="342" class="label muted">01 · PUBLIC ATS INPUT</text>
      <g transform="translate(118 380)">
        <rect width="270" height="82" rx="18" fill="#E8EEFF"/><circle cx="34" cy="41" r="15" fill="#7797F0"/><text x="62" y="36" class="title ink">Greenhouse</text><text x="62" y="61" class="small muted">jobs payload · board name</text>
        <rect y="101" width="270" height="82" rx="18" fill="#E4F5EF"/><circle cx="34" cy="142" r="15" fill="#59C49E"/><text x="62" y="137" class="title ink">Lever</text><text x="62" y="162" class="small muted">postings payload · page title</text>
        <rect y="202" width="270" height="82" rx="18" fill="#FFF0D9"/><circle cx="34" cy="243" r="15" fill="#EDB45E"/><text x="62" y="238" class="title ink">Ashby</text><text x="62" y="263" class="small muted">jobs payload · declared site</text>
      </g>
      <text x="118" y="691" font-size="15" class="muted">Buyer tokens · public sources only</text>

      <rect x="470" y="266" width="556" height="482" rx="30" fill="#172B46"/>
      <text x="510" y="319" class="label" fill="#B4C6E2">02 · BOUNDED PROCESSING</text>
      <g transform="translate(510 357)">
        <rect width="476" height="62" rx="16" fill="#213D60"/><text x="24" y="39" class="body" fill="#F4F8FF">✓ strict 1–100 tokens · 12 MB source cap</text>
        <rect y="78" width="476" height="62" rx="16" fill="#213D60"/><text x="24" y="117" class="body" fill="#F4F8FF">✓ normalize roles · preserve posting basis</text>
        <rect y="156" width="476" height="62" rx="16" fill="#213D60"/><text x="24" y="195" class="body" fill="#F4F8FF">✓ expose bare-token owner candidates</text>
        <rect y="234" width="476" height="62" rx="16" fill="#213D60"/><text x="24" y="273" class="body" fill="#F4F8FF">✓ stable IDs · evidence · confidence · gaps</text>
        <rect y="312" width="476" height="76" rx="16" fill="#102237" stroke="#67E3B4"/><text x="24" y="343" class="small" fill="#A9C7C2">HONESTY BOUNDARY</text><text x="24" y="373" class="body" fill="#67E3B4">Postings are not buying intent.</text>
      </g>

      <rect x="1072" y="292" width="446" height="430" rx="28" fill="#FFFFFF"/>
      <text x="1108" y="342" class="label muted">03 · DECISION LAYER</text>
      <g transform="translate(1108 380)">
        <rect width="374" height="70" rx="18" fill="#E8EEFF"/><text x="24" y="30" class="small" fill="#536A9B">OBSERVE</text><text x="24" y="56" class="title ink">role mix + timestamps</text>
        <rect y="88" width="374" height="70" rx="18" fill="#E4F5EF"/><text x="24" y="118" class="small" fill="#46776D">VERIFY</text><text x="24" y="144" class="title ink">board identity + evidence</text>
        <rect y="176" width="374" height="70" rx="18" fill="#FFF0D9"/><text x="24" y="206" class="small" fill="#7E633A">QUALIFY</text><text x="24" y="232" class="title ink">with independent context</text>
        <rect y="264" width="374" height="72" rx="18" fill="#213D60"/><text x="24" y="294" class="small" fill="#B8CAE6">REVIEW</text><text x="24" y="321" class="title" fill="#FFFFFF">confidence + gaps + action</text>
      </g>
    </g>
    <path d="M432 507 H456" stroke="#557DE1" stroke-width="7" stroke-linecap="round"/><path d="M446 495 L462 507 L446 519" fill="none" stroke="#557DE1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1034 507 H1058" stroke="#2FA987" stroke-width="7" stroke-linecap="round"/><path d="M1048 495 L1064 507 L1048 519" fill="none" stroke="#2FA987" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(82 792)"><rect width="1436" height="62" rx="20" fill="#172B46"/><text x="30" y="40" class="body" fill="#F5FAFF">Observed fact → source scope → identity confidence → explicit gap → recommended human action</text><text x="1258" y="40" class="label" fill="#67E3B4">REVIEW READY</text></g>
  </g>
</svg>
