<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Company Hiring Radar evidence for account research</title>
  <desc id="desc">Buyer-supplied ATS board tokens become public role observations, evidence, confidence, data gaps, and a review-ready next action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10172B"/><stop offset=".55" stop-color="#17253B"/><stop offset="1" stop-color="#123B3A"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8AA8FF"/><stop offset="1" stop-color="#67E3B4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".34"/></filter>
    <style>.s{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.w{fill:#F7FAFF}.m{fill:#B1BED0}.label{font-size:19px;font-weight:780;letter-spacing:2px}.body{font-size:23px}.small{font-size:18px}.card{font-size:27px;font-weight:760}.metric{font-size:42px;font-weight:830}</style>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/><circle cx="1430" cy="100" r="270" fill="#67E3B4" opacity=".07"/><circle cx="60" cy="850" r="300" fill="#8AA8FF" opacity=".07"/>
  <g class="s">
    <g transform="translate(82 58)"><rect width="332" height="46" rx="23" fill="#8AA8FF" opacity=".14"/><circle cx="27" cy="23" r="8" fill="#8AA8FF"/><text x="48" y="31" class="label" fill="#BFCBFF">PUBLIC HIRING EVIDENCE</text></g>
    <text x="82" y="175" class="w" font-size="61" font-weight="830">See what a company is hiring for —</text>
    <text x="82" y="244" font-size="61" font-weight="830" fill="url(#accent)">without pretending it proves intent</text>
    <text x="84" y="294" class="m" font-size="24">Greenhouse, Lever, and Ashby observations with identity checks, evidence, gaps, and next actions.</text>
    <g filter="url(#shadow)">
      <rect x="82" y="354" width="354" height="352" rx="28" fill="#17233B" stroke="#45577B" stroke-width="2"/>
      <text x="118" y="405" class="label m">01 · BOARD WATCHLIST</text>
      <rect x="118" y="444" width="282" height="62" rx="16" fill="#101A2D"/><circle cx="146" cy="475" r="10" fill="#8AA8FF"/><text x="170" y="483" class="body w">greenhouse:stripe</text>
      <rect x="118" y="520" width="282" height="62" rx="16" fill="#101A2D"/><circle cx="146" cy="551" r="10" fill="#67E3B4"/><text x="170" y="559" class="body w">lever:spotify</text>
      <rect x="118" y="596" width="282" height="62" rx="16" fill="#101A2D"/><circle cx="146" cy="627" r="10" fill="#F7BD69"/><text x="170" y="635" class="body w">pulse · bare token</text>
      <text x="118" y="690" class="small m">1–100 tokens · explicit is safest</text>

      <rect x="486" y="330" width="628" height="402" rx="30" fill="#F7F9FD"/>
      <text x="524" y="382" class="label" fill="#627086">02 · LIVE ATS OBSERVATION</text>
      <text x="524" y="431" class="card" fill="#17253B">Selected board: greenhouse / stripe</text>
      <g transform="translate(524 466)">
        <rect width="252" height="100" rx="20" fill="#E8EEFF"/><text x="23" y="44" class="metric" fill="#365EBB">550</text><text x="23" y="76" class="small" fill="#526681">open roles observed</text><text x="23" y="96" font-size="15" fill="#74839A">SOURCE PAYLOAD</text>
        <rect x="270" width="284" height="100" rx="20" fill="#E2F7EF"/><text x="293" y="44" class="metric" fill="#16775A">130</text><text x="293" y="76" class="small" fill="#4D6B62">engineering labels</text><text x="293" y="96" font-size="15" fill="#708A82">KEYWORD CLASSIFIED</text>
        <rect y="120" width="252" height="100" rx="20" fill="#FFF0D8"/><text x="23" y="162" class="card" fill="#8A5A12">176 dated roles</text><text x="23" y="196" class="small" fill="#715F40">inside 30-day window</text>
        <rect x="270" y="120" width="284" height="100" rx="20" fill="#EEE8FA"/><text x="293" y="162" class="card" fill="#5E4A86">Intent: not proven</text><text x="293" y="196" class="small" fill="#716681">public postings only</text>
      </g>
      <text x="524" y="710" class="small" fill="#687486">Every metric keeps scope, evidence, confidence, and gaps.</text>

      <rect x="1164" y="354" width="354" height="352" rx="28" fill="#15343A" stroke="#3B6B69" stroke-width="2"/>
      <text x="1200" y="405" class="label m">03 · REVIEW ACTION</text>
      <rect x="1200" y="445" width="282" height="69" rx="18" fill="#204850"/><text x="1228" y="474" class="small" fill="#A9D9D0">VERIFY</text><text x="1228" y="501" class="body w">board identity</text>
      <rect x="1200" y="531" width="282" height="69" rx="18" fill="#204850"/><text x="1228" y="560" class="small" fill="#A9D9D0">RESEARCH</text><text x="1228" y="587" class="body w">role mix + source links</text>
      <rect x="1200" y="617" width="282" height="55" rx="18" fill="#67E3B4"/><text x="1228" y="652" class="card" fill="#0C2926">REVIEW FIRST</text>
      <text x="1200" y="696" class="small m">safeToAutomate = false</text>
    </g>
    <path d="M444 530 H474" stroke="#8AA8FF" stroke-width="7" stroke-linecap="round"/><path d="M462 518 L478 530 L462 542" fill="none" stroke="#8AA8FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1122 530 H1152" stroke="#67E3B4" stroke-width="7" stroke-linecap="round"/><path d="M1140 518 L1156 530 L1140 542" fill="none" stroke="#67E3B4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(82 790)"><rect width="1436" height="62" rx="20" fill="#111D31" stroke="#3A4C67"/><text x="30" y="40" class="body w">No login · No ATS API key · No headcount-growth or buying-intent claim · Review-ready JSON</text><text x="1254" y="40" class="label" fill="#67E3B4">EVIDENCE FIRST</text></g>
  </g>
</svg>
