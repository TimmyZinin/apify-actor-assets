<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Sitemap to Knowledge</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071226"/><stop offset="1" stop-color="#0B1830"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1490" cy="60" r="260" fill="#2457FF" opacity="0.11"/>
  <circle cx="60" cy="850" r="220" fill="#23D5AB" opacity="0.08"/>

  <text x="82" y="100" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="760" fill="#FFFFFF">Sitemap to Knowledge</text>
  <text x="84" y="205" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="500" fill="#AFC3E8">Turn an authorized public sitemap into bounded, source-linked text</text><text x="84" y="242.5" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="500" fill="#AFC3E8">chunks with crawl completeness and billing truth.</text>

  <rect x="82" y="330" width="420" height="390" rx="28" fill="#12213D" stroke="#62A4FF" stroke-width="2"/>
  <text x="114" y="384" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#62A4FF">BUYER INPUT</text>
  <circle cx="124" cy="435" r="7" fill="#62A4FF"/><text x="146" y="444" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">Authorized public websites</text><circle cx="124" cy="507" r="7" fill="#62A4FF"/><text x="146" y="516" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">Sitemap or homepage fallback</text><circle cx="124" cy="579" r="7" fill="#62A4FF"/><text x="146" y="588" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">Bounded site concurrency</text>
  <path d="M520 525 H585" stroke="#55739E" stroke-width="5"/><path d="M585 525 l-18 -12 v24z" fill="#55739E"/>

  <rect x="600" y="330" width="420" height="390" rx="28" fill="#12213D" stroke="#A77BFF" stroke-width="2"/>
  <text x="632" y="384" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#A77BFF">DECISION LAYER</text>
  <circle cx="642" cy="435" r="7" fill="#A77BFF"/><text x="664" y="444" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">Reject private and special</text><text x="664" y="475.25" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">addresses</text><circle cx="642" cy="507" r="7" fill="#A77BFF"/><text x="664" y="516" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">Extract deterministic visible</text><text x="664" y="547.25" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">text</text><circle cx="642" cy="579" r="7" fill="#A77BFF"/><text x="664" y="588" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">Attach hashes, caps and crawl</text><text x="664" y="619.25" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">gaps</text>
  <path d="M1038 525 H1103" stroke="#55739E" stroke-width="5"/><path d="M1103 525 l-18 -12 v24z" fill="#55739E"/>

  <rect x="1118" y="330" width="400" height="390" rx="28" fill="#12213D" stroke="#23D5AB" stroke-width="2"/>
  <text x="1150" y="384" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#23D5AB">BUYER OUTCOME</text>
  <circle cx="1160" cy="435" r="7" fill="#23D5AB"/><text x="1182" y="444" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">Source-linked knowledge</text><text x="1182" y="475.25" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">chunks</text><circle cx="1160" cy="507" r="7" fill="#23D5AB"/><text x="1182" y="516" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">Confidence and completeness</text><text x="1182" y="547.25" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">evidence</text><circle cx="1160" cy="579" r="7" fill="#23D5AB"/><text x="1182" y="588" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">Review-before-indexing action</text>
  <text x="84" y="790" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="500" fill="#8FA8CF">AI product, documentation, agency, content and data teams</text>

  <text x="1510" y="855" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="20" fill="#7E93B5">ZININ DATA PRODUCTS · APIFY</text>
</svg>
