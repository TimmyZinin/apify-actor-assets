  <circle cx="1160" cy="435" r="7" fill="#23D5AB"/><text x="1182" y="444" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">New, changed or stopped</text><text x="1182" y="475.25" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">evidence</text><circle cx="1160" cy="507" r="7" fill="#23D5AB"/><text x="1182" y="516" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">Confidence, gaps and source</text><text x="1182" y="547.25" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">links</text><circle cx="1160" cy="579" r="7" fill="#23D5AB"/><text x="1182" y="588" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">Unsent human-review action</text>
  <text x="84" y="790" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="500" fill="#8FA8CF">Marketing teams, agencies, brand operators and competitive-intelligence</text>

  <text x="1510" y="855" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="20" fill="#7E93B5">ZININ DATA PRODUCTS · APIFY</text>
