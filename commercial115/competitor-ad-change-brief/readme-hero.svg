  <circle cx="124" cy="435" r="7" fill="#62A4FF"/><text x="146" y="444" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">Normalized ad rows or Dataset</text><circle cx="124" cy="507" r="7" fill="#62A4FF"/><text x="146" y="516" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">Stable watch and source</text><text x="146" y="547.25" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">contract</text><circle cx="124" cy="579" r="7" fill="#62A4FF"/><text x="146" y="588" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500" fill="#D9E7FF">Explicit coverage evidence</text>
  <path d="M520 525 H585" stroke="#55739E" stroke-width="5"/><path d="M585 525 l-18 -12 v24z" fill="#55739E"/>

