<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0E1523"></rect><g font-family="Arial,Helvetica,sans-serif"><text x="72" y="86" font-size="20" fill="#EEC46F" font-weight="700">FROM SOURCE DATA TO AN ASSESSMENT</text><text x="72" y="178" font-size="49" fill="#F6F8FC" font-weight="700">Review observed appointment connections.</text><text x="72" y="230" font-size="26" fill="#C4CFDE" font-weight="400">Example batch: 2 appointment assessments from observed source records.</text><rect x="72" y="328" width="456" height="338" rx="24" fill="#172133" stroke="#334157" stroke-width="2"></rect><text x="100" y="374" font-size="20" fill="#EEC46F" font-weight="700">01  INPUT</text><text data-fit-width="400" x="100" y="426" font-size="29" fill="#F4F7FC" font-weight="700">Companies House rows</text><text x="100" y="488" font-size="24" fill="#C4CFDE" font-weight="400">Exact officer identifiers</text><text x="100" y="536" font-size="24" fill="#C4CFDE" font-weight="400">Company and role evidence</text><text x="100" y="584" font-size="24" fill="#C4CFDE" font-weight="400">Reported interval dates</text><rect x="572" y="328" width="456" height="338" rx="24" fill="#172133" stroke="#334157" stroke-width="2"></rect><text x="600" y="374" font-size="20" fill="#EEC46F" font-weight="700">02  PROCESS</text><text data-fit-width="400" x="600" y="426" font-size="29" fill="#F4F7FC" font-weight="700">Explainable rules</text><text x="600" y="488" font-size="24" fill="#C4CFDE" font-weight="400">Match opaque officer IDs</text><text x="600" y="536" font-size="24" fill="#C4CFDE" font-weight="400">Compare known intervals</text><text x="600" y="584" font-size="24" fill="#C4CFDE" font-weight="400">Preserve identity limits</text><rect x="1072" y="328" width="456" height="338" rx="24" fill="#172133" stroke="#334157" stroke-width="2"></rect><text x="1100" y="374" font-size="20" fill="#EEC46F" font-weight="700">03  RESULT</text><text data-fit-width="400" x="1100" y="426" font-size="29" fill="#F4F7FC" font-weight="700">Appointment assessments</text><text x="1100" y="488" font-size="24" fill="#C4CFDE" font-weight="400">Observed company links</text><text x="1100" y="536" font-size="24" fill="#C4CFDE" font-weight="400">Explicit chronology limits</text><text x="1100" y="584" font-size="24" fill="#C4CFDE" font-weight="400">Source row references</text><path d="M545 494h16m-7-8 8 8-8 8" fill="none" stroke="#EEC46F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M1045 494h16m-7-8 8 8-8 8" fill="none" stroke="#EEC46F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><text x="72" y="730" font-size="23" fill="#B1BED0" font-weight="400">This example uses saved source data. Process a new source batch for a fresh assessment.</text><text x="72" y="816" font-size="18" fill="#91A3BE" font-weight="700">ZININ  /  COMPANY OFFICER APPOINTMENT OVERLAP</text><text x="72" y="858" font-size="22" fill="#91A3BE" font-weight="400">Source evidence stays visible. Unknown data stays unknown.</text></g></svg>