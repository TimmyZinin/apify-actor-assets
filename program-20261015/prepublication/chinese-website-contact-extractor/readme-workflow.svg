ain</text><rect x="1220" y="265" width="330" height="210" rx="24" fill="#1b3151" stroke="#3b5979"/><text x="1244" y="315" font-size="20" fill="#6de3c2">04</text><text x="1244" y="370" font-size="28" fill="#ffffff" font-weight="700">Site result</text><text x="1244" y="420" font-size="19" fill="#c0d0e4">One complete site event</text><rect x="80" y="545" width="1440" height="62" rx="14" fill="#22344d"/><circle cx="112" cy="576" r="6" fill="#ffc56b"/><text x="140" y="585" font-size="25" fill="#dce7f3">Same-origin follow only</text><rect x="80" y="627" width="1440" height="62" rx="14" fill="#22344d"/><circle cx="112" cy="658" r="6" fill="#ffc56b"/><text x="140" y="667" font-size="25" fill="#dce7f3">Social links remain inert</text><rect x="80" y="709" width="1440" height="62" rx="14" fill="#22344d"/><circle cx="112" cy="740" r="6" fill="#ffc56b"/><text x="140" y="749" font-size="25" fill="#dce7f3">ICP is format metadata</text><text x="80" y="854" font-size="18" fill="#849bb8">Local build diagram · 1600 × 900 · No live-source acceptance implied</text></g></svg>