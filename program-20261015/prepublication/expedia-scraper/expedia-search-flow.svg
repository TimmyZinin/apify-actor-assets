<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#0B1823"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="60" y="95" font-size="54" font-weight="700" fill="#FFFFFF">Expedia: observed hotel cards</text>
<text x="60" y="153" font-size="29" fill="#BDCCD6">One destination, explicit stay context, and a bounded search snapshot.</text>
<rect x="60" y="220" width="440" height="470" rx="20" fill="#142733" stroke="#72D1FF" stroke-width="3"/>
<text x="88" y="282" font-size="24" font-weight="700" fill="#72D1FF">INPUT</text>
<text x="88" y="355" font-size="27" fill="#FFFFFF">1–30 destinations</text>
<text x="88" y="417" font-size="27" fill="#FFFFFF">Real calendar dates</text>
<text x="88" y="479" font-size="27" fill="#FFFFFF">1–8 adults</text>
<text x="88" y="541" font-size="27" fill="#FFFFFF">Limit: 1–300 per place</text>
<text x="88" y="647" font-size="22" fill="#BDCCD6">Blank checkout: +2 UTC days</text>
<path d="M516 450h46m-14-14 14 14-14 14" fill="none" stroke="#BDCCD6" stroke-width="4"/>
<rect x="580" y="220" width="440" height="470" rx="20" fill="#142733" stroke="#FFD75E" stroke-width="3"/>
<text x="608" y="282" font-size="24" font-weight="700" fill="#FFD75E">PAGE EXTRACTION</text>
<text x="608" y="355" font-size="27" fill="#FFFFFF">US residential browser</text>
<text x="608" y="417" font-size="27" fill="#FFFFFF">Page-owned GraphQL</text>
<text x="608" y="479" font-size="27" fill="#FFFFFF">DOM fallback</text>
<text x="608" y="541" font-size="27" fill="#FFFFFF">Blocked / empty outcomes</text>
<text x="608" y="647" font-size="22" fill="#BDCCD6">No full-inventory guarantee</text>
<path d="M1036 450h46m-14-14 14 14-14 14" fill="none" stroke="#BDCCD6" stroke-width="4"/>
<rect x="1100" y="220" width="440" height="470" rx="20" fill="#142733" stroke="#A9E4BC" stroke-width="3"/>
<text x="1128" y="282" font-size="24" font-weight="700" fill="#A9E4BC">DATASET</text>
<text x="1128" y="355" font-size="27" fill="#FFFFFF">Hotel ID and name</text>
<text x="1128" y="417" font-size="27" fill="#FFFFFF">Nightly / total figures</text>
<text x="1128" y="479" font-size="27" fill="#FFFFFF">Guest rating and reviews</text>
<text x="1128" y="541" font-size="27" fill="#FFFFFF">Date, currency, timestamp</text>
<text x="1128" y="647" font-size="22" fill="#BDCCD6">Missing fields may be null</text>
<text x="60" y="782" font-size="28" fill="#FFFFFF">A search card is an observation, not a guaranteed bookable rate.</text>
<text x="60" y="834" font-size="25" fill="#BDCCD6">Start fees still apply when no paid hotel rows are delivered.</text>
</g></svg>
