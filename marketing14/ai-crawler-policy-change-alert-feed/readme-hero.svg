    <rect x="1120" y="17" width="245" height="38" rx="19" fill="url(#violet)"/><text x="1242" y="43" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">NO LLM KEY</text>
