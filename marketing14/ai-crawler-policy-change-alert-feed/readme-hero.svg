  <text x="96" y="174" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="750">Know what changed. Route the right action.</text>
  <text x="96" y="219" fill="#a9bad1" font-family="Inter,Arial,sans-serif" font-size="25">Deterministic policy drift for SEO, GEO, AEO, brand, and content teams</text>

