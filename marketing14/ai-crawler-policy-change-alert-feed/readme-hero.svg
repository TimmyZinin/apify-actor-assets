  <path d="M925 486h57" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round"/><path d="m971 470 21 16-21 16" fill="none" stroke="#53dfdf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
