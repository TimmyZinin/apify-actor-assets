  <text x="138" y="382" fill="#7893ad" font-family="ui-monospace,Menlo,monospace" font-size="17">2026-08-24 · result 7cc3…</text>
  <circle cx="556" cy="334" r="14" fill="#9f78ff"/><text x="586" y="344" fill="#ede7ff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">CURRENT</text>
  <text x="556" y="382" fill="#9288bd" font-family="ui-monospace,Menlo,monospace" font-size="17">2026-08-31 · result d18a…</text>
