    <rect x="132" y="500" width="318" height="62" rx="14" fill="#132a38"/><text x="158" y="539" fill="#b9fff6">GPTBot</text><text x="406" y="539" text-anchor="end" fill="#54e2d9">ALLOW</text>
    <rect x="132" y="578" width="318" height="62" rx="14" fill="#132a38"/><text x="158" y="617" fill="#b9fff6">llms.txt</text><text x="406" y="617" text-anchor="end" fill="#54e2d9">FOUND</text>
