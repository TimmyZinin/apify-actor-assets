<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Schema.org for LLMs Audit product overview</title>
  <desc id="desc">A marketer submits public URLs and receives evidence-backed LLM readiness grades, missing facts, and fixes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2f3d32" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="score" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97745"/>
      <stop offset="0.58" stop-color="#e5ad48"/>
      <stop offset="1" stop-color="#2e7d5b"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#f6f0e4"/>
  <circle cx="1455" cy="-40" r="330" fill="#e5d6be" opacity="0.54"/>
  <circle cx="120" cy="870" r="245" fill="#dce8da" opacity="0.74"/>
  <path d="M0 7H1600" stroke="#2e7d5b" stroke-width="14"/>

  <g transform="translate(82 72)">
    <rect width="86" height="38" rx="19" fill="#dce8da"/>
    <circle cx="24" cy="19" r="8" fill="#2e7d5b"/>
    <text x="42" y="25" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f513e">GEO</text>
    <text x="0" y="113" font-family="Inter, Arial, sans-serif" font-size="61" font-weight="800" letter-spacing="-1.5" fill="#243129">Schema.org for LLMs Audit</text>
    <text x="0" y="166" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="500" fill="#536058">Turn public-page metadata into a prioritized AI visibility brief.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="300" width="408" height="402" rx="30" fill="#fffdf8"/>
    <rect x="596" y="300" width="408" height="402" rx="30" fill="#fffdf8"/>
    <rect x="1114" y="300" width="408" height="402" rx="30" fill="#fffdf8"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(110 330)">
      <rect width="108" height="36" rx="18" fill="#f2dccd"/>
      <text x="54" y="24" text-anchor="middle" font-size="16" font-weight="800" fill="#8e3f24">INPUT</text>
      <text x="0" y="91" font-size="32" font-weight="800" fill="#243129">Your public pages</text>

      <g transform="translate(0 129)">
        <rect width="344" height="64" rx="14" fill="#f7f3eb" stroke="#ded5c8"/>
        <circle cx="30" cy="32" r="12" fill="none" stroke="#d97745" stroke-width="3"/>
        <path d="M19 32h22M30 20c5 5 5 19 0 24M30 20c-5 5-5 19 0 24" fill="none" stroke="#d97745" stroke-width="2"/>
        <text x="56" y="39" font-size="21" fill="#3d4941">Homepage</text>
      </g>
      <g transform="translate(0 207)">
        <rect width="344" height="64" rx="14" fill="#f7f3eb" stroke="#ded5c8"/>
        <path d="M20 21h22v22H20zM25 28h12M25 34h9" fill="none" stroke="#d97745" stroke-width="3" stroke-linecap="round"/>
        <text x="56" y="39" font-size="21" fill="#3d4941">Product page</text>
      </g>
      <g transform="translate(0 285)">
        <rect width="344" height="64" rx="14" fill="#f7f3eb" stroke="#ded5c8"/>
        <path d="M20 21h22v22H20zM25 27h12M25 33h12M25 39h8" fill="none" stroke="#d97745" stroke-width="3" stroke-linecap="round"/>
        <text x="56" y="39" font-size="21" fill="#3d4941">Article page</text>
      </g>
    </g>

    <g transform="translate(628 330)">
      <rect width="132" height="36" rx="18" fill="#efe6c8"/>
      <text x="66" y="24" text-anchor="middle" font-size="16" font-weight="800" fill="#775b13">EVIDENCE</text>
      <text x="0" y="91" font-size="32" font-weight="800" fill="#243129">Five fact surfaces</text>

      <g font-size="20" fill="#3d4941">
        <circle cx="17" cy="144" r="17" fill="#e8f0e7"/><path d="M9 144l6 6 11-13" fill="none" stroke="#2e7d5b" stroke-width="3"/><text x="48" y="151">JSON-LD entities</text>
        <circle cx="17" cy="194" r="17" fill="#e8f0e7"/><path d="M9 194l6 6 11-13" fill="none" stroke="#2e7d5b" stroke-width="3"/><text x="48" y="201">Microdata &amp; RDFa</text>
        <circle cx="17" cy="244" r="17" fill="#e8f0e7"/><path d="M9 244l6 6 11-13" fill="none" stroke="#2e7d5b" stroke-width="3"/><text x="48" y="251">OpenGraph metadata</text>
        <circle cx="17" cy="294" r="17" fill="#e8f0e7"/><path d="M9 294l6 6 11-13" fill="none" stroke="#2e7d5b" stroke-width="3"/><text x="48" y="301">Canonical URL</text>
        <circle cx="17" cy="344" r="17" fill="#e8f0e7"/><path d="M9 344l6 6 11-13" fill="none" stroke="#2e7d5b" stroke-width="3"/><text x="48" y="351">Cross-surface consistency</text>
      </g>
    </g>

    <g transform="translate(1146 330)">
      <rect width="114" height="36" rx="18" fill="#dce8da"/>
      <text x="57" y="24" text-anchor="middle" font-size="16" font-weight="800" fill="#1f513e">DECISION</text>
      <text x="0" y="91" font-size="32" font-weight="800" fill="#243129">A brief you can act on</text>

      <g transform="translate(0 126)">
        <circle cx="74" cy="76" r="71" fill="#e8f0e7"/>
        <circle cx="74" cy="76" r="58" fill="#2e7d5b"/>
        <text x="74" y="72" text-anchor="middle" font-size="41" font-weight="900" fill="#fffdf8">84</text>
        <text x="74" y="100" text-anchor="middle" font-size="17" font-weight="800" fill="#dce8da">GRADE B</text>
        <text x="174" y="48" font-size="19" font-weight="700" fill="#243129">Readiness score</text>
        <rect x="174" y="65" width="150" height="12" rx="6" fill="#e9e1d6"/>
        <rect x="174" y="65" width="126" height="12" rx="6" fill="url(#score)"/>
        <text x="174" y="110" font-size="18" fill="#536058">Identity matched</text>
        <text x="174" y="140" font-size="18" fill="#536058">2 gaps · 1 conflict</text>
      </g>

      <g transform="translate(0 298)">
        <rect width="344" height="64" rx="14" fill="#f7f3eb" stroke="#ded5c8"/>
        <circle cx="30" cy="32" r="13" fill="#f2dccd"/>
        <path d="M30 24v10M30 40h.01" stroke="#a34b2b" stroke-width="3" stroke-linecap="round"/>
        <text x="55" y="28" font-size="17" font-weight="800" fill="#3d4941">NEXT FIX</text>
        <text x="55" y="49" font-size="16" fill="#536058">Add Product offers.price</text>
      </g>
    </g>
  </g>

  <g stroke="#2e7d5b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M505 501h64"/>
    <path d="M557 486l15 15-15 15"/>
    <path d="M1023 501h64"/>
    <path d="M1075 486l15 15-15 15"/>
  </g>

  <g transform="translate(80 790)" font-family="Inter, Arial, sans-serif">
    <rect width="1440" height="64" rx="20" fill="#243129"/>
    <text x="30" y="40" font-size="22" font-weight="700" fill="#f6f0e4">No LLM · no API key · no browser</text>
    <circle cx="497" cy="32" r="5" fill="#d97745"/>
    <text x="526" y="40" font-size="22" font-weight="700" fill="#f6f0e4">Robots-aware &amp; SSRF-guarded</text>
    <circle cx="938" cy="32" r="5" fill="#d97745"/>
    <text x="967" y="40" font-size="22" font-weight="700" fill="#f6f0e4">Pay only per delivered audit</text>
  </g>
</svg>
