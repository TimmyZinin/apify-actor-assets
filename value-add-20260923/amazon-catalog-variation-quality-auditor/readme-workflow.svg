<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0E1523"></rect><g font-family="Arial,Helvetica,sans-serif"><text x="72" y="86" font-size="20" fill="#EEC46F" font-weight="700">RUN IT AFTER YOUR SOURCE ACTOR</text><text x="72" y="178" font-size="50" fill="#F6F8FC" font-weight="700">A new source batch. A useful next step.</text><text x="72" y="230" font-size="26" fill="#C4CFDE" font-weight="400">Connect an upstream run through Apify Integrations, API or a saved task.</text><rect x="72" y="330" width="334" height="338" rx="24" fill="#172133" stroke="#334157" stroke-width="2"></rect><text x="100" y="376" font-size="20" fill="#EEC46F" font-weight="700">01  TRIGGER</text><text data-fit-width="278" x="100" y="428" font-size="29" fill="#F4F7FC" font-weight="700">New source run</text><text x="100" y="490" font-size="24" fill="#C4CFDE" font-weight="400">Schedule, API</text><text x="100" y="538" font-size="24" fill="#C4CFDE" font-weight="400">or completion event</text><text x="100" y="586" font-size="24" fill="#C4CFDE" font-weight="400">Read existing records</text><rect x="450" y="330" width="334" height="338" rx="24" fill="#172133" stroke="#334157" stroke-width="2"></rect><text x="478" y="376" font-size="20" fill="#EEC46F" font-weight="700">02  INPUT</text><text data-fit-width="278" x="478" y="428" font-size="29" fill="#F4F7FC" font-weight="700">Source Dataset</text><text x="478" y="490" font-size="24" fill="#C4CFDE" font-weight="400">Dataset ID or rows</text><text x="478" y="538" font-size="24" fill="#C4CFDE" font-weight="400">Permitted source data</text><text x="478" y="586" font-size="24" fill="#C4CFDE" font-weight="400">No automatic re-scrape</text><rect x="828" y="330" width="334" height="338" rx="24" fill="#172133" stroke="#334157" stroke-width="2"></rect><text x="856" y="376" font-size="20" fill="#EEC46F" font-weight="700">03  DECISION</text><text data-fit-width="278" x="856" y="428" font-size="29" fill="#F4F7FC" font-weight="700">This Actor</text><text x="856" y="490" font-size="24" fill="#C4CFDE" font-weight="400">Transparent rules</text><text x="856" y="538" font-size="24" fill="#C4CFDE" font-weight="400">Useful result records</text><text x="856" y="586" font-size="24" fill="#C4CFDE" font-weight="400">Free diagnostics</text><rect x="1206" y="330" width="334" height="338" rx="24" fill="#172133" stroke="#334157" stroke-width="2"></rect><text x="1234" y="376" font-size="20" fill="#EEC46F" font-weight="700">04  ACTION</text><text data-fit-width="278" x="1234" y="428" font-size="26.610005157297575" fill="#F4F7FC" font-weight="700">Catalog import review</text><text x="1234" y="490" font-size="24" fill="#C4CFDE" font-weight="400">Review the evidence</text><text x="1234" y="538" font-size="24" fill="#C4CFDE" font-weight="400">Export or map fields</text><text x="1234" y="586" font-size="24" fill="#C4CFDE" font-weight="400">Refresh with new data</text><path d="M423 494h14m-6-8 8 8-8 8" fill="none" stroke="#EEC46F" stroke-width="4" stroke-linecap="round"></path><path d="M801 494h14m-6-8 8 8-8 8" fill="none" stroke="#EEC46F" stroke-width="4" stroke-linecap="round"></path><path d="M1179 494h14m-6-8 8 8-8 8" fill="none" stroke="#EEC46F" stroke-width="4" stroke-linecap="round"></path><text x="72" y="730" font-size="23" fill="#B1BED0" font-weight="400">Set the result and charge limits. Route useful records separately from incomplete-source diagnostics.</text><text x="72" y="816" font-size="18" fill="#91A3BE" font-weight="700">ZININ  /  AMAZON CATALOG VARIATION QUALITY AUDITOR</text><text x="72" y="858" font-size="22" fill="#91A3BE" font-weight="400">Source evidence stays visible. Unknown data stays unknown.</text></g></svg>